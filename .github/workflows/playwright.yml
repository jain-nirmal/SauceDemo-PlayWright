name: Playwright Tests 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shard: [1,2,3]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
     
      - name: Run Playwright test (Shard ${{ matrix.shard }}) with XVFB
        run: xvfb-run --auto-servernum -- npx playwright test --shard=${{ matrix.shard }}/3

      - name: upload Allure Results (Shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: allure-results


  merge-allure-results:
    needs: playwright-tests
    if: always() # Run this job even if the previous one fails
    runs-on: ubuntu-latest

    steps:
      - name: checkout code 
        uses: actions/checkout@v4
        with:
          name: allure-results-shard-1
        